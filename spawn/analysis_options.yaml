include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Documentation of the public surface is a shipping requirement here, not a
    # suggestion: this package is written to Dart SDK library standards.
    public_member_api_docs: error

linter:
  rules:
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - comment_references
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
